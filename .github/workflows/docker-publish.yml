name: docker-publish

on:
  workflow_dispatch:
    inputs:
      napcat_version:
        description: 'NapCatQQ release tag（留空则取 latest）'
        required: false
        default: ''

jobs:
  publish-dockerhub:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Get artifacts
        run: |
          VERSION="${{ inputs.napcat_version }}"
          if [ -z "$VERSION" ]; then
            VERSION=$(curl -sSL -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" "https://api.github.com/repos/NapNeko/NapCatQQ/releases/latest" | jq -r '.tag_name')
          fi
          echo "Building with NapCat $VERSION"
          echo "version=$VERSION" >> "$GITHUB_ENV"
          bash get_artifacts.sh ${{ secrets.GITHUB_TOKEN }} "$VERSION"
      - name: Set up Docker buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Fork from https://github.com/koishijs/boilerplate/blob/master/.github/workflows/docker.yml
      - name: Run buildx and push
        env:
          DOCKER_REPO: ghcr.io/${{ github.repository_owner }}/napcat-docker
          GITHUB_REPO: NapNeko/NapCatQQ
        run: |
          TAGS="--tag ${DOCKER_REPO}:${{ env.version }}"
          if [ -z "${{ inputs.napcat_version }}" ]; then
            TAGS="$TAGS --tag ${DOCKER_REPO}:edge"
          fi
          docker buildx build \
            --output "type=image,push=true" \
            --platform linux/amd64,linux/arm64 \
            ${TAGS} \
            --file ./Dockerfile \
            .
      - name: GHCR logout
        if: always()
        run: docker logout ghcr.io
